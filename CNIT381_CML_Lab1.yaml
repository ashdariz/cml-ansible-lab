    configuration:
      - name: user-data
        content: |-
          #cloud-config
          hostname: ubuntu
          manage_etc_hosts: True

          system_info:
            default_user:
              name: cisco

          password: cisco
          chpasswd: { expire: False }
          ssh_pwauth: True

          # Network configuration
          write_files:
            - path: /etc/netplan/01-netcfg.yaml
              content: |
                network:
                  version: 2
                  renderer: networkd
                  ethernets:
                    ens2:
                      addresses: [192.168.100.10/24]
                    ens3:
                      dhcp4: yes
              permissions: '0644'

          # Run commands after boot
          runcmd:
            - netplan generate
            - netplan apply
            - sleep 10  # Wait for network to stabilize
            - apt update
            - apt install -y ansible sshpass python3-paramiko
            - echo "Setup complete - Ansible installed" > /home/cisco/setup-complete.txt

          final_message: "Ubuntu server ready!"
